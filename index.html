
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BarSafe — Gestion de bar en toute transparence</title>
    <meta name="description" content="BarSafe : menu par QR code, service en temps réel, encaissement sécurisé et pilotage du stock pour les bars et lounges." />
    <meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF4EA" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="BarSafe — Gestion de bar" />
    <meta property="og:description" content="Menu QR, service temps réel, encaissement sécurisé et stock maîtrisé." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151210'/%3E%3Cpath d='M7 9h18l-7 7.6V22h3.4v2H11.6v-2H15v-5.4z' fill='%23E0A33E'/%3E%3Ccircle cx='16' cy='7' r='1.6' fill='%23E0A33E'/%3E%3C/svg%3E" />

    <!-- Fix theme before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.style.colorScheme = t;
          document.documentElement.style.background = t === 'dark' ? '#151210' : '#FAF4EA';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              bg:           'rgb(var(--bg) / <alpha-value>)',
              raise:        'rgb(var(--bg-2) / <alpha-value>)',
              surface:      'rgb(var(--surface) / <alpha-value>)',
              surface2:     'rgb(var(--surface-2) / <alpha-value>)',
              ink:          'rgb(var(--ink) / <alpha-value>)',
              muted:        'rgb(var(--muted) / <alpha-value>)',
              faint:        'rgb(var(--faint) / <alpha-value>)',
              line:         'rgb(var(--line) / <alpha-value>)',
              accent:       'rgb(var(--accent) / <alpha-value>)',
              accentStrong: 'rgb(var(--accent-strong) / <alpha-value>)',
              onAccent:     'rgb(var(--on-accent) / <alpha-value>)',
              positive:     'rgb(var(--positive) / <alpha-value>)',
              warn:         'rgb(var(--warn) / <alpha-value>)',
              danger:       'rgb(var(--danger) / <alpha-value>)',
            },
            fontFamily: {
              display: ['Fraunces', 'ui-serif', 'Georgia', 'serif'],
              sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            borderRadius: {
              '4xl': '2rem',
              '5xl': '2.5rem',
            },
            boxShadow: {
              soft: '0 1px 2px rgb(var(--shadow) / 0.06), 0 14px 40px -18px rgb(var(--shadow) / 0.22)',
              lift: '0 10px 44px -12px rgb(var(--shadow) / 0.34)',
            },
            maxWidth: {
              content: '78rem',
            },
          },
        },
      }
    </script>

</html>
